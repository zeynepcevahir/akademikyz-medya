name: Quiet Empires günlük yükleme
on:
  schedule:
    - cron: "0 15 * * *"   # her gün 15:00 UTC (18:00 İstanbul, 08:00 ABD Pasifik)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 quiet/yt_yukle.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_QUIET_TOKEN: ${{ secrets.YT_QUIET_TOKEN }}
          QUIET_GIZLILIK: private
      - run: |
          git config user.name "yayin-botu"; git config user.email "bot@users.noreply.github.com"
          git add quiet/yayinlandi.json && git commit -m "Quiet Empires: yayinlandi kaydi" && git push || true
