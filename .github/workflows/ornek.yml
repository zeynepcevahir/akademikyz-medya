# Geriye dönük Shorts görünüm örnekleri (elle başlatılır, YouTube'a yüklemez).
name: Shorts örnekleri
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ornek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Örnek üret
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q requests
          python3 oto/geriye_ornek.py
      - uses: actions/upload-artifact@v4
        with:
          name: ornek
          path: |
            ornek/*.mp4
            ornek/*.png
      - name: Örnekleri "ornek" dalına koy
        run: |
          cd ornek && rm -rf g* && git init -q -b ornek && git add . \
            && git -c user.name=OtoPaylasim -c user.email=noreply@anthropic.com commit -qm "Shorts örnekleri" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ornek
