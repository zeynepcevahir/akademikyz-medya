# Instagram anahtarının bir hesabı görüp göremediğini denetler (yalnızca okur, elle başlatılır).
name: Hesapları listele
on:
  workflow_dispatch:
    inputs:
      ig_id:
        description: Denetlenecek Instagram kimliği
        default: ""
permissions:
  contents: read
jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - name: Denetle
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ inputs.ig_id }}
        run: |
          echo "== hesap =="
          curl -s "https://graph.facebook.com/v24.0/$IG_ID?fields=id,username,media_count&access_token=$IG_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print('SONUC', d.get('username') or ('HATA: ' + d.get('error',{}).get('message','')[:200]))"
          echo "== izinler =="
          curl -s "https://graph.facebook.com/v24.0/me/permissions?access_token=$IG_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print('IZIN', [p['permission'] for p in d.get('data',[]) if p.get('status')=='granted'], d.get('error',{}).get('message','')[:150])"
          curl -s "https://graph.facebook.com/v24.0/me?fields=id,name&access_token=$IG_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print('KIM', d.get('name'), d.get('error',{}).get('message','')[:150])"
