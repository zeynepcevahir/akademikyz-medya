# Instagram anahtarının erişebildiği hesapları listeler (yalnızca okur, elle başlatılır).
name: Hesapları listele
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - name: Listele
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          curl -s "https://graph.facebook.com/v24.0/me/accounts?fields=name,instagram_business_account%7Bid,username%7D&limit=50&access_token=$IG_TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(p.get('name'), '|', (p.get('instagram_business_account') or {}).get('username'), (p.get('instagram_business_account') or {}).get('id')) for p in d.get('data',[])]; print(d.get('error',{}).get('message',''))"
