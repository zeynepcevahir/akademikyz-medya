name: Instagram paylaşımı
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: paylasim
  cancel-in-progress: false
jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
      OTOPAYLASIM_EV: oto
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Kuyrukta iş var mı?
        id: kontrol
        run: |
          if ls kuyruk | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}_'; then echo "var=1" >> "$GITHUB_OUTPUT"; fi
      - name: Hazırlık
        if: steps.kontrol.outputs.var == '1'
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q requests
          git config user.name "OtoPaylasim"
          git config user.email "noreply@anthropic.com"
      - name: Paylaş
        if: steps.kontrol.outputs.var == '1'
        run: python3 oto/otopaylasim.py calistir
      - name: Durumu kaydet
        if: always() && steps.kontrol.outputs.var == '1'
        run: |
          git add -A oto/durum.json kuyruk oto/kayitlar 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Paylaşım durumu"
            for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
