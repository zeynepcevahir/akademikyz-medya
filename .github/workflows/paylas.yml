name: Instagram paylaşımı
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      yukleme_dene:
        description: "Yalnızca görsel yükleme denemesi yap"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  issues: write
concurrency:
  group: paylasim
  cancel-in-progress: false
jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Istanbul
      OTOPAYLASIM_EV: oto
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_TEZ_TOKEN: ${{ secrets.IG_TEZ_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Kuyrukta iş var mı?
        id: kontrol
        run: |
          if [ "${{ inputs.yukleme_dene }}" = "true" ]; then echo "var=1" >> "$GITHUB_OUTPUT"; fi
          if ls kuyruk | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}_'; then echo "var=1" >> "$GITHUB_OUTPUT"; fi
      - name: Hazırlık
        if: steps.kontrol.outputs.var == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q requests
          git config user.name "OtoPaylasim"
          git config user.email "noreply@anthropic.com"
      - name: Paylaş
        if: steps.kontrol.outputs.var == '1'
        run: |
          if [ "${{ inputs.yukleme_dene }}" = "true" ]; then python3 oto/otopaylasim.py yukleme-dene; else python3 oto/otopaylasim.py calistir; fi
      - name: YouTube Shorts
        if: always() && steps.kontrol.outputs.var == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_OSM_TOKEN: ${{ secrets.YT_OSM_TOKEN }}
          YT_HASBIHAL_TOKEN: ${{ secrets.YT_HASBIHAL_TOKEN }}
          YT_TEZ_TOKEN: ${{ secrets.YT_TEZ_TOKEN }}
        run: python3 oto/youtube.py
      - name: Durumu kaydet
        if: always() && steps.kontrol.outputs.var == '1'
        run: |
          # Her yol ayrı eklenir: biri yoksa diğerleri (ör. kuyruktan arşive taşımalar) yine kaydedilsin.
          for y in oto/durum.json oto/youtube_durum.json kuyruk oto/kayitlar; do [ -e "$y" ] || git ls-files --error-unmatch "$y" >/dev/null 2>&1 && git add -A -- "$y"; done
          if ! git diff --cached --quiet; then
            git commit -q -m "Paylaşım durumu"
            for i in 1 2 3 4; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
          fi
      - name: Hata uyarısı
        if: failure() && steps.kontrol.outputs.var == '1'
        env:
          REPO: ${{ github.repository }}
        run: |
          oto/uyari.sh "Paylaşım hatası" "Paylaşım işi hata verdi: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} . Ayrıntı: oto/kayitlar/otopaylasim.log ve oto/durum.json (son_hata)."
