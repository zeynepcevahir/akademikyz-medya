# Günlük kontrol: Instagram anahtarı çalışıyor mu, saati geçmiş paylaşım var mı?
# Sorun varsa iş kırmızı biter ve depoda "uyarı" kaydı (issue) açılır; GitHub e-posta ile bildirir.
name: Günlük kontrol
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  kontrol:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - name: Anahtar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if ! python3 oto/anahtar_kontrol.py; then
            oto/uyari.sh "Instagram anahtarı çalışmıyor" "Günlük kontrolde anahtar (IG_TOKEN) çalışmadı; paylaşımlar durabilir. Meta Business ayarlarından yeni anahtar üretip GitHub gizli alanına kaydedin."
            exit 1
          fi
      - name: Tez Vitrini anahtarı
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TEZ_TOKEN }}
        run: |
          [ -z "$IG_TOKEN" ] && { echo "IG_TEZ_TOKEN yok; atlandı."; exit 0; }
          if ! python3 oto/anahtar_kontrol.py; then
            oto/uyari.sh "Instagram anahtarı çalışmıyor" "Günlük kontrolde Tez Vitrini anahtarı (IG_TEZ_TOKEN) çalışmadı; @tezvitrini paylaşımları durabilir."
            exit 1
          fi
      - name: Gecikmiş paylaşım
        run: |
          g=$(oto/gecikme_kontrol.sh)
          if [ -n "$g" ]; then
            echo "$g"
            oto/uyari.sh "Gecikmiş paylaşım" "Günlük kontrol: saati geçtiği hâlde paylaşılmamış gönderi(ler): $(echo $g)"
            exit 1
          fi
          echo "Gecikmiş paylaşım yok."
