# Instagram anahtarının (IG_TOKEN) geçerliliğini haftada bir denetler.
# Süre 15 günden azsa veya anahtar geçersizse iş kırmızı biter (GitHub e-posta ile bildirir).
name: Anahtar kontrolü
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bitiş tarihi
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 oto/anahtar_kontrol.py
